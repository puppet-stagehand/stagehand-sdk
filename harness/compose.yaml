# Real-tool harness (FND-06, D-07). Started only by harness/run.sh.
#
# No "name:" key: the compose project name comes from COMPOSE_PROJECT_NAME,
# which run.sh derives from the repo path so two checkouts (for example parallel
# worktrees) never share containers or volumes. Nothing here publishes a port.
#
# The image reference comes from harness/run.sh (RUNNER_IMAGE_REF): the digest
# recorded in harness/images.lock when there is one, else the local tag. The tag
# carries the registry host and project (D-18) from the gitignored
# harness/.env. There is no default on purpose.
services:
  runner:
    build:
      context: runner
      args:
        RUBY_IMAGE: ${RUBY_IMAGE:?run the harness through ./harness/run.sh}
        R10K_VERSION: ${R10K_VERSION:?run the harness through ./harness/run.sh}
        BOLT_VERSION: ${BOLT_VERSION:?run the harness through ./harness/run.sh}
        G10K_VERSION: ${G10K_VERSION:?run the harness through ./harness/run.sh}
        G10K_SHA256_LINUX_AMD64: ${G10K_SHA256_LINUX_AMD64:?run the harness through ./harness/run.sh}
        G10K_SHA256_LINUX_ARM64: ${G10K_SHA256_LINUX_ARM64:?run the harness through ./harness/run.sh}
        HTTP_REQUEST_VERSION: ${HTTP_REQUEST_VERSION:?run the harness through ./harness/run.sh}
    image: ${RUNNER_IMAGE_REF:?run harness/run.sh}
    volumes:
      - certs:/certs:ro
      - gitfixtures:/srv/git
      - work:/srv/work
      - ./scripts:/opt/harness-scripts:ro
      - ./fixture-modules:/opt/fixture-modules:ro
    healthcheck:
      test: ["CMD-SHELL", "r10k version && g10k -version && bolt --version"]
      interval: 10s
      timeout: 60s
      retries: 6
      start_period: 5s

  # Puppet Server 9 (D-18). It runs only in the compose profile "server", which
  # harness/run.sh turns on when the image can be resolved. There is deliberately
  # no build section: the image needs a Puppet Core credential, so only
  # harness/images.sh (run by a human) builds it and compose never tries.
  # An empty SERVER_PLATFORM means the image's native platform.
  puppetserver:
    profiles: ["server"]
    image: ${SERVER_IMAGE_REF:?run harness/run.sh}
    platform: ${SERVER_PLATFORM:-}
    hostname: puppet
    volumes:
      - certs:/certs
      # The entrypoint is harness logic, not Puppet Core content: mounting it
      # lets it change without rebuilding and re-pushing the credentialed image.
      - ./server/entrypoint.sh:/usr/local/bin/harness-server-entrypoint:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost:8140/status/v1/simple | grep -q running"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 180s

volumes:
  # Certificates written by the server entrypoint, read-only in the runner.
  certs:
  gitfixtures:
  work:
