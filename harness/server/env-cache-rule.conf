# Inserted by the Dockerfile at the top of the rules list in the package's own
# auth.conf. It lets exactly one certificate flush the environment cache. This
# models the allow-list the operator has to add on a real server.
{
    match-request: {
        path: "/puppet-admin-api/v1/environment-cache"
        type: path
        method: delete
    }
    allow: ["runner.test"]
    sort-order: 200
    name: "stagehand-harness env-cache flush, runner only"
},
