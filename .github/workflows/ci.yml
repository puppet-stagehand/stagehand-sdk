name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: [self-hosted, Linux, X64, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: buf lint
        run: buf lint
      - name: buf generate drift check
        run: |
          buf generate
          git diff --exit-code gen/
      - name: buf breaking (contract_version compatibility gate)
        run: buf breaking --against '.git#branch=main'
      - run: go build ./...
      - run: go test ./... -race
      - name: expansion-build (nested module; ./... skips it)
        run: go test ./cmd/expansion-build/... -race
      - name: expansion-index (nested module; ./... skips it)
        run: go test ./cmd/expansion-index/... -race
