// Host facets. A worker may call only the facets its manifest `permissions`
// declare; the host refuses others with PERMISSION_DENIED + ErrorDetail
// {code: "facet_not_declared"} and audits the attempt. While the pack is
// disabled every call fails FAILED_PRECONDITION {code: "pack_disabled"}.
syntax = "proto3";
package stagehand.host.v1;
option go_package = "github.com/puppet-stagehand/stagehand-sdk/gen/go/stagehand/host/v1;hostv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "stagehand/host/v1/common.proto";

// ---------------------------------------------------------------- Documents
// Always granted (own namespace). Permission string: documents:rw
service Documents {
  rpc Get(GetDocumentRequest) returns (Document);
  rpc Put(PutDocumentRequest) returns (PutDocumentResponse);       // CAS on if_version (0 = create-only)
  rpc List(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc Query(QueryDocumentsRequest) returns (ListDocumentsResponse); // single-field filter on body
  rpc Delete(DeleteDocumentRequest) returns (google.protobuf.Empty);
}
message Document {
  string collection = 1; string doc_id = 2; Json body = 3; int64 version = 4;
  google.protobuf.Timestamp created_at = 5; google.protobuf.Timestamp updated_at = 6;
}
message GetDocumentRequest { string collection = 1; string doc_id = 2; }
message PutDocumentRequest { string collection = 1; string doc_id = 2; Json body = 3; int64 if_version = 4; }
message PutDocumentResponse { int64 version = 1; }
message ListDocumentsRequest { string collection = 1; Page page = 2; }
message ListDocumentsResponse { repeated Document documents = 1; PageInfo page = 2; }
message QueryDocumentsRequest {
  string collection = 1; string field = 2;  // dotted path into body
  enum Op { OP_UNSPECIFIED = 0; EQ = 1; NE = 2; GT = 3; GTE = 4; LT = 5; LTE = 6; CONTAINS = 7; }
  Op op = 3; Json value = 4; Page page = 5;
}
message DeleteDocumentRequest { string collection = 1; string doc_id = 2; int64 if_version = 3; }

// ----------------------------------------------------------------- Settings
// Always granted.
service Settings {
  rpc Current(google.protobuf.Empty) returns (SettingsDocument);
  rpc Subscribe(google.protobuf.Empty) returns (stream SettingsChange);
}
message SettingsDocument { Json values = 1; int64 version = 2; }
message SettingsChange { int64 version = 1; google.protobuf.Timestamp at = 2; }

// ----------------------------------------------------------------- Activity
// Record: always granted (kind is prefixed pack.<id>. by the host).
// Stream: permission activity:read
service Activity {
  rpc Record(ActivityEvent) returns (google.protobuf.Empty);
  rpc Stream(ActivityStreamRequest) returns (stream ActivityEvent);
}
message ActivityEvent {
  string kind = 1; string subject = 2; string summary = 3; Json fields = 4;
  google.protobuf.Timestamp at = 5; string actor = 6;  // set by host on Record
}
message ActivityStreamRequest { google.protobuf.Timestamp since = 1; repeated string kinds = 2; }

// ------------------------------------------------------------------ Metrics
// Always granted; names are prefixed stagehand_pack_<id>_ by the host.
service Metrics { rpc Push(MetricBatch) returns (google.protobuf.Empty); }
message MetricBatch { repeated MetricSample samples = 1; }
message MetricSample {
  string name = 1; map<string,string> labels = 2; double value = 3;
  enum Kind { KIND_UNSPECIFIED = 0; COUNTER = 1; GAUGE = 2; HISTOGRAM = 3; }
  Kind kind = 4; google.protobuf.Timestamp at = 5;
}

// ------------------------------------------------------------------ Secrets
// Permission: secrets:rw. Refs are namespaced pack/<id>/<name> by the host.
// Reveal is written to the Activity Log.
service Secrets {
  rpc Store(StoreSecretRequest) returns (SecretRef);
  rpc Reveal(SecretRef) returns (SecretValue);
  rpc Seal(SecretValue) returns (Sealed);     // encrypt for storage in Documents
  rpc Open(Sealed) returns (SecretValue);
  rpc Delete(SecretRef) returns (google.protobuf.Empty);
}
message StoreSecretRequest { string name = 1; bytes plaintext = 2; }
message SecretRef { string ref = 1; }
message SecretValue { bytes plaintext = 1; }
message Sealed { bytes ciphertext = 1; bytes nonce = 2; string key_id = 3; }

// --------------------------------------------------------------------- Bolt
// Permission: bolt:run. Targets are certnames or device ids; the host
// resolves transport (Bolt inventory derived from PuppetDB, ADR 0002).
service Bolt {
  rpc RunTask(RunTaskRequest) returns (RunHandle);
  rpc RunPlan(RunPlanRequest) returns (RunHandle);
  rpc Result(RunHandle) returns (RunResult);
  rpc Watch(RunHandle) returns (stream RunEvent);
  rpc Cancel(RunHandle) returns (google.protobuf.Empty);
}
message RunTaskRequest { string task = 1; repeated string targets = 2; Json params = 3; bool dry_run = 4; string reason = 5; }
message RunPlanRequest { string plan = 1; Json params = 2; string reason = 3; }
message RunHandle { string run_id = 1; }
message RunResult {
  string run_id = 1;
  enum Status { STATUS_UNSPECIFIED = 0; QUEUED = 1; RUNNING = 2; SUCCEEDED = 3; FAILED = 4; CANCELLED = 5; }
  Status status = 2; repeated TargetResult targets = 3;
  google.protobuf.Timestamp started_at = 4; google.protobuf.Timestamp finished_at = 5;
}
message TargetResult { string target = 1; bool ok = 2; Json value = 3; string error = 4; }
message RunEvent { string run_id = 1; RunResult.Status status = 2; TargetResult target = 3; google.protobuf.Timestamp at = 4; }

// ---------------------------------------------------------------- Inventory
// Read: inventory:read. Kinds: inventory:kind:<name>.
service Inventory {
  rpc Nodes(InventoryFilter) returns (NodeList);
  rpc Devices(InventoryFilter) returns (DeviceList);
  rpc RegisterKind(KindSpec) returns (google.protobuf.Empty);   // idempotent
  rpc UpsertItem(InventoryItem) returns (google.protobuf.Empty);
  rpc DeleteItem(ItemRef) returns (google.protobuf.Empty);
  rpc Items(ItemsRequest) returns (ItemList);
}
message InventoryFilter { string query = 1; Page page = 2; }  // PQL-like subset documented in docs/facets.md
message Node { string certname = 1; string status = 2; string environment = 3; google.protobuf.Timestamp last_report = 4; Json facts_summary = 5; }
message NodeList { repeated Node nodes = 1; PageInfo page = 2; }
message Device { string id = 1; string name = 2; string address = 3; string transport = 4; string status = 5; }
message DeviceList { repeated Device devices = 1; PageInfo page = 2; }
message KindSpec { string kind = 1; string label = 2; string label_plural = 3; Json item_schema = 4; }  // item_schema: JSON Schema
message InventoryItem { string kind = 1; string id = 2; Json body = 3; int64 if_version = 4; }
message ItemRef { string kind = 1; string id = 2; }
message ItemsRequest { string kind = 1; InventoryFilter filter = 2; }
message ItemList { repeated InventoryItem items = 1; PageInfo page = 2; }

// --------------------------------------------------------------- Compliance
// Permission: compliance:ingest. Batch is compliance.v1 (docs/compliance-schema.md)
// carried as Json, plus the subject kind (node | device | <registered kind>).
service Compliance { rpc Ingest(ComplianceBatch) returns (IngestReceipt); }
message ComplianceBatch { string subject_kind = 1; Json batch = 2; }
message IngestReceipt { int32 controls = 1; string benchmark = 2; }

// --------------------------------------------------------------------- Auth
// Permission: tokens:issue. Scopes are namespaced pack:<id>:<scope>.
service Auth {
  rpc IssueToken(IssueTokenRequest) returns (IssuedToken);
  rpc Verify(VerifyTokenRequest) returns (Principal);
  rpc Revoke(TokenRef) returns (google.protobuf.Empty);
}
message IssueTokenRequest { string scope = 1; string label = 2; int64 ttl_seconds = 3; }
message IssuedToken { string token_id = 1; string secret = 2; google.protobuf.Timestamp expires_at = 3; }  // secret shown once
message VerifyTokenRequest { string secret = 1; string scope = 2; }
message Principal { string token_id = 1; string label = 2; repeated string scopes = 3; }
message TokenRef { string token_id = 1; }

// -------------------------------------------------------------------- Forge
// Permission: forge:rw. Resolves the pack's Content module. The live Forge service is proto/stagehand/host/v1/host.proto.
service Forge {
  rpc Resolve(ForgeResolveRequest) returns (ForgeRelease);
  rpc Installed(ForgeSlug) returns (ForgeRelease);
}
message ForgeSlug { string slug = 1; }
message ForgeResolveRequest { string slug = 1; string version_range = 2; }
message ForgeRelease { string slug = 1; string version = 2; string sha256 = 3; string download_url = 4; }

// ------------------------------------------------------------------ PuppetDB
// Permission: puppetdb:read. Rate-limited per pack; result cap 5000 rows.
service PuppetDB {
  rpc Query(PdbQuery) returns (PdbRows);
  rpc Facts(FactsRequest) returns (FactsResponse);
  rpc Reports(ReportsRequest) returns (ReportsResponse);
}
message PdbQuery { string pql = 1; Page page = 2; }
message PdbRows { repeated Json rows = 1; PageInfo page = 2; }
message FactsRequest { repeated string certnames = 1; repeated string names = 2; }
message FactsResponse { map<string, Json> facts_by_certname = 1; }
message ReportsRequest { string certname = 1; TimeRange range = 2; Page page = 3; }
message Report { string certname = 1; string status = 2; google.protobuf.Timestamp at = 3; string environment = 4; Json metrics = 5; }
message ReportsResponse { repeated Report reports = 1; PageInfo page = 2; }

// ------------------------------------------------------------ Classification
// Permission: classification:read (no writes in contract 1).
service Classification {
  rpc Groups(google.protobuf.Empty) returns (GroupList);
  rpc NodeGroups(Certname) returns (GroupList);
  rpc Classes(GroupRef) returns (ClassList);
}
message GroupRef { string id = 1; }
message Group { string id = 1; string name = 2; string parent_id = 3; string environment = 4; }
message GroupList { repeated Group groups = 1; }
message Class { string name = 1; Json parameters = 2; }
message ClassList { repeated Class classes = 1; }

// --------------------------------------------------------------------- Code
// Permission: code:read. Scoped to repos the operator grants the pack.
service Code {
  rpc Repos(google.protobuf.Empty) returns (RepoList);
  rpc Tree(TreeRequest) returns (TreeResponse);
  rpc File(FileRequest) returns (FileResponse);
}
message Repo { string id = 1; string name = 2; string default_ref = 3; }
message RepoList { repeated Repo repos = 1; }
message TreeRequest { string repo_id = 1; string ref = 2; string path = 3; }
message TreeEntry { string path = 1; bool dir = 2; int64 size = 3; }
message TreeResponse { repeated TreeEntry entries = 1; }
message FileRequest { string repo_id = 1; string ref = 2; string path = 3; }
message FileResponse { bytes content = 1; string sha = 2; }

// ------------------------------------------------------------------- Legacy
// Permission: legacy:read:<table>. TEMPORARY — granted only to a pack that is
// extracting a console feature; removed one release after that pack ships.
service Legacy { rpc Read(LegacyReadRequest) returns (LegacyRows); }
message LegacyReadRequest { string table = 1; Page page = 2; }
message LegacyRows { repeated Json rows = 1; PageInfo page = 2; }
