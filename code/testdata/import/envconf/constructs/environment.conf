# Fixture for the RESEARCH fixture catalog (Real-World Fixture Catalog,
# environment.conf table): one example of every catalog row. The lenient
# parser must import the two good settings and warn once for each of the four
# bad lines (one unrecognised key, two malformed lines, one invalid boolean).

# catalog row: a recognised setting (kept)
modulepath = site-modules:modules:$basemodulepath

# catalog row: unknown key (envconf_unrecognized_key, line skipped)
strict_variables = true

# catalog row: section header (envconf_malformed_line, line skipped)
[main]

# catalog row: line without '=' (envconf_malformed_line, line skipped)
this line has no equals sign

# catalog row: non-boolean for a boolean key (envconf_invalid_boolean, field left unset)
static_catalogs = maybe

# catalog row: a recognised setting after the bad lines (kept)
config_version = 'scripts/config_version.sh $environmentpath $environment'
